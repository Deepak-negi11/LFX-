name: Update LFX data

# Runs every day: crawls LFX Mentorship, rebuilds the site data and, if anything really
# changed, commits it. Vercel redeploys the site on every commit, so new programs and
# terms show up the day after LFX lists them. Can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC daily
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the updated data
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # Reuse the last crawl so finished programs aren't fetched again.
      - name: Restore previous crawl
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: lfx-raw-${{ github.run_id }}
          restore-keys: lfx-raw-

      - name: Crawl LFX Mentorship
        run: node scripts/crawl.mjs

      - name: Save crawl
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: lfx-raw-${{ github.run_id }}

      - name: Build site data
        run: node scripts/build-data.mjs

      # Never commit data that would break the site.
      - name: Check the site still builds
        run: bun run build

      # Commit only real changes (timestamps alone don't count). These commits also keep
      # the repo active, so GitHub doesn't pause this schedule.
      - name: Commit updated data
        run: |
          if ! node scripts/data-changed.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/site.json
          git commit -m "chore(data): update LFX Mentorship data"
          git push

  # Keep-alive: GitHub pauses scheduled workflows in repos with no commits for 60 days
  # (possible between LFX seasons). Re-enabling the workflow through the API on every
  # scheduled run prevents that, with no commits. Runs even if the crawl fails.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable the daily schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
